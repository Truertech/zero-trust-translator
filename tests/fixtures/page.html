<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Zero Trust Translator fixture</title>
  </head>
  <body>
    <h1>Members</h1>
    <ul id="members">
      <li><span data-zt-id="macc1" id="marker-macc1">Macc1</span></li>
      <li><span data-zt-id="MACC2" id="marker-macc2">Macc2</span></li>
      <li><span id="marker-no-id">No marker here</span></li>
    </ul>
    <div id="dynamic"></div>
    <button id="add-marker-button" type="button">Add a marker</button>
    <script>
      // Stands in for "the page's own JavaScript": every check the E2E spec
      // runs against DOM isolation reads from what this script captured, not
      // from the extension.
      window.__capturedMessages = [];
      window.addEventListener('message', (event) => window.__capturedMessages.push(event.data), true);

      document.getElementById('add-marker-button').addEventListener('click', () => {
        const span = document.createElement('span');
        span.id = 'marker-macc3';
        span.dataset.ztId = 'macc3';
        span.textContent = 'Macc3';
        document.getElementById('dynamic').appendChild(span);
      });
    </script>
  </body>
</html>
