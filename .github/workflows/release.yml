name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - run: npm ci

      - name: Check the tag matches manifest.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          MANIFEST_VERSION=$(node -p "require('./manifest.json').version")
          if [ "$TAG" != "$MANIFEST_VERSION" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match manifest.json version ${MANIFEST_VERSION}" >&2
            exit 1
          fi

      - name: Compute SOURCE_DATE_EPOCH from the tagged commit
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      - name: Build twice and compare the hashes
        run: npm run build:check

      - name: Build the release zip
        run: npm run build
        env:
          SOURCE_DATE_EPOCH: ${{ env.SOURCE_DATE_EPOCH }}

      - run: npm run check-no-network

      - name: Attach build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist.zip

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist.zip dist.zip.sha256 \
            --title "${GITHUB_REF_NAME}" \
            --notes "Built from $(git rev-parse HEAD). SHA-256: $(cat dist.zip.sha256)."

      - name: Record whether the Chrome Web Store secrets are present
        # A secret cannot be read directly in an `if:` condition (GitHub
        # Actions refuses that), so its presence is recorded as a plain
        # environment variable first.
        run: echo "HAS_CWS_SECRETS=${{ secrets.CWS_CLIENT_ID != '' }}" >> "$GITHUB_ENV"

      - name: Upload to the Chrome Web Store
        if: ${{ env.HAS_CWS_SECRETS == 'true' }}
        env:
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
        run: |
          ACCESS_TOKEN=$(curl -s -X POST "https://oauth2.googleapis.com/token" \
            -d "client_id=${CWS_CLIENT_ID}" \
            -d "client_secret=${CWS_CLIENT_SECRET}" \
            -d "refresh_token=${CWS_REFRESH_TOKEN}" \
            -d "grant_type=refresh_token" | node -p "JSON.parse(require('fs').readFileSync(0)).access_token")

          curl -s -X PUT \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "x-goog-api-version: 2" \
            -T dist.zip \
            "https://www.googleapis.com/upload/chromewebstore/v1.1/items/${CWS_EXTENSION_ID}"

          curl -s -X POST \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "x-goog-api-version: 2" \
            -H "Content-Length: 0" \
            "https://www.googleapis.com/chromewebstore/v1.1/items/${CWS_EXTENSION_ID}/publish"

      - name: No Chrome Web Store secrets — skipping the upload
        if: ${{ env.HAS_CWS_SECRETS != 'true' }}
        run: echo "CWS_CLIENT_ID is not set (a fork or a test tag). The release is published to GitHub; the Chrome Web Store upload is skipped."
