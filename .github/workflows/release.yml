name: Release

# Two events start a release:
# - A merge to main. When CI passes on the main push, the `bump` job raises
#   the patch version in manifest.json and package.json, commits it, tags it
#   and pushes both. The `release` job then builds and publishes that tag.
# - A `v*` tag pushed by hand. The `release` job builds and publishes it.
#
# The bump commit and the tag are pushed with GITHUB_TOKEN. GitHub starts no
# workflow for a push made with GITHUB_TOKEN, so the bump commit does not
# start CI or this workflow again.
on:
  push:
    tags:
      - 'v*'
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  bump:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      !startsWith(github.event.workflow_run.head_commit.message, 'chore(release):')
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Stop when main has moved past the tested commit
        id: tip
        env:
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ "$(git rev-parse HEAD)" != "$TESTED_SHA" ]; then
            echo "main is at $(git rev-parse HEAD), CI passed on $TESTED_SHA. The CI run of the newer commit releases it."
            echo "moved=true" >> "$GITHUB_OUTPUT"
          else
            echo "moved=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Raise the patch version, commit, tag and push
        id: bump
        if: steps.tip.outputs.moved == 'false'
        run: |
          set -euo pipefail
          NEXT=$(node scripts/bump-patch.mjs)
          if git rev-parse -q --verify "refs/tags/v${NEXT}" >/dev/null; then
            echo "Tag v${NEXT} exists already." >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add manifest.json package.json
          git commit -m "chore(release): bump version to ${NEXT}"
          git tag "v${NEXT}"
          git push origin HEAD:main "v${NEXT}"
          echo "tag=v${NEXT}" >> "$GITHUB_OUTPUT"

  release:
    needs: bump
    if: >-
      always() &&
      ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
       (needs.bump.result == 'success' && needs.bump.outputs.tag != ''))
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || needs.bump.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ github.event_name == 'push' && github.ref_name || needs.bump.outputs.tag }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - run: npm ci

      - name: Check the tag matches manifest.json version
        run: |
          TAG="${RELEASE_TAG#v}"
          MANIFEST_VERSION=$(node -p "require('./manifest.json').version")
          if [ "$TAG" != "$MANIFEST_VERSION" ]; then
            echo "Tag ${RELEASE_TAG} does not match manifest.json version ${MANIFEST_VERSION}" >&2
            exit 1
          fi

      - name: Compute SOURCE_DATE_EPOCH from the tagged commit
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      - name: Build twice and compare the hashes
        run: npm run build:check

      - name: Build the release zip
        run: |
          npm run build
          echo "ZIP=zero-trust-translator-${RELEASE_TAG#v}.zip" >> "$GITHUB_ENV"
        env:
          SOURCE_DATE_EPOCH: ${{ env.SOURCE_DATE_EPOCH }}

      - run: npm run check-no-network

      - name: Attach build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ env.ZIP }}

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo '## Install'
            echo ''
            echo "1. Download \`${ZIP}\` below and unzip it into a folder."
            echo '2. Open `chrome://extensions`, turn on **Developer mode**, click **Load unpacked** and pick that folder.'
            echo ''
            echo '## Check'
            echo ''
            echo "Built by CI from commit $(git rev-parse HEAD)."
            echo "SHA-256 of \`${ZIP}\`: \`$(cat "${ZIP}.sha256")\`"
          } > release-notes.md
          gh release create "${RELEASE_TAG}" "${ZIP}" "${ZIP}.sha256" \
            --title "Zero Trust Translator ${RELEASE_TAG#v}" \
            --notes-file release-notes.md

      - name: Record whether the Chrome Web Store secrets are present
        # A secret cannot be read directly in an `if:` condition (GitHub
        # Actions refuses that), so its presence is recorded as a plain
        # environment variable first.
        run: echo "HAS_CWS_SECRETS=${{ secrets.CWS_CLIENT_ID != '' }}" >> "$GITHUB_ENV"

      - name: Upload to the Chrome Web Store
        if: ${{ env.HAS_CWS_SECRETS == 'true' }}
        env:
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
        # `curl -f` fails the step on an HTTP error status. The Store also
        # answers a refused upload or publish with HTTP 200 and a failure in
        # the body, so the step reads each body and fails unless it reports
        # success.
        run: |
          set -euo pipefail

          TOKEN_RESPONSE=$(curl -fsS -X POST "https://oauth2.googleapis.com/token" \
            -d "client_id=${CWS_CLIENT_ID}" \
            -d "client_secret=${CWS_CLIENT_SECRET}" \
            -d "refresh_token=${CWS_REFRESH_TOKEN}" \
            -d "grant_type=refresh_token")
          ACCESS_TOKEN=$(printf '%s' "$TOKEN_RESPONSE" | node -e "process.stdout.write(JSON.parse(require('fs').readFileSync(0, 'utf8')).access_token ?? '')")
          if [ -z "$ACCESS_TOKEN" ]; then
            echo "The token request returned no access_token." >&2
            exit 1
          fi
          echo "::add-mask::${ACCESS_TOKEN}"

          UPLOAD_RESPONSE=$(curl -fsS -X PUT \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "x-goog-api-version: 2" \
            -T "${ZIP}" \
            "https://www.googleapis.com/upload/chromewebstore/v1.1/items/${CWS_EXTENSION_ID}")
          echo "Upload response: ${UPLOAD_RESPONSE}"
          printf '%s' "$UPLOAD_RESPONSE" | node -e "
            const body = JSON.parse(require('fs').readFileSync(0, 'utf8'));
            if (body.uploadState !== 'SUCCESS') {
              console.error('The Chrome Web Store refused the upload: uploadState is ' + body.uploadState + '.');
              process.exit(1);
            }"

          PUBLISH_RESPONSE=$(curl -fsS -X POST \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "x-goog-api-version: 2" \
            -H "Content-Length: 0" \
            "https://www.googleapis.com/chromewebstore/v1.1/items/${CWS_EXTENSION_ID}/publish")
          echo "Publish response: ${PUBLISH_RESPONSE}"
          printf '%s' "$PUBLISH_RESPONSE" | node -e "
            const body = JSON.parse(require('fs').readFileSync(0, 'utf8'));
            const status = Array.isArray(body.status) ? body.status : [body.status];
            if (!status.includes('OK')) {
              console.error('The Chrome Web Store refused the publish: status is ' + JSON.stringify(body.status) + '.');
              process.exit(1);
            }"

      - name: No Chrome Web Store secrets — skipping the upload
        if: ${{ env.HAS_CWS_SECRETS != 'true' }}
        run: echo "CWS_CLIENT_ID is not set (a fork or a test tag). The release is published to GitHub; the Chrome Web Store upload is skipped."
